<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>名片</title>
  <style>
    :root {
      color-scheme: light;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      background: #e6dfd0;
      color: #2b261f;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .card {
      width: min(280px, calc(100% - 32px));
      padding: 28px 24px 24px;
      border-radius: 18px;
      background: #fbf6ec;
      box-shadow: 0 16px 40px rgba(62, 42, 22, 0.14);
    }

    .seal {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #2c6b4e;
      color: #fbf6ec;
      font-size: 22px;
    }

    h1 {
      margin: 16px 0 0;
      font-size: 22px;
      font-weight: 600;
    }

    .role {
      margin: 4px 0 18px;
      color: #8a7f72;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 12px;
      font-size: 14px;
    }

    dt {
      color: #8a7f72;
    }

    dd {
      margin: 0;
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="seal" aria-hidden="true">竹</div>
    <h1>小竹样本</h1>
    <p class="role">文件预览试样</p>
    <dl>
      <dt>位置</dt>
      <dd>代码 / 名片.html</dd>
      <dt>内容</dt>
      <dd>一页自包含的网页</dd>
      <dt>用途</dt>
      <dd>在预览里直接打开</dd>
    </dl>
  </article>
</body>
</html>
