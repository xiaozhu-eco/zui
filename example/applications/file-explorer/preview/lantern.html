    <h1>灯塔摘录</h1>
    <p>海风把盐粒吹到窗台上，刮得玻璃细细地响。老人划亮火柴，灯芯慢慢站直，光从玻璃罩里铺到看不见的水面上。</p>
    <p>小岛只有这一座塔。白天它是白的，晚上它才说话。</p>
    <p>女孩是黄昏时划船来的。船头捆着两桶煤油，她把绳子扔上来，喊了一声爷爷。</p>
    <p>远处有一星渔火。老人数那明灭的次数，数到七，火就稳了。他在日志上写：西北风，能见度差，一船通过。</p>
