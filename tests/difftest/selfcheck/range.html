<!DOCTYPE html>
<html>
<body>
  <input id="slider" type="range" min="0" max="100" value="10" oninput="on_slider" onchange="on_slider">
  <input id="frozen" type="range" min="0" max="100" value="10" onpointerdown="on_freeze" oninput="on_frozen" onchange="on_frozen">
  <input id="stepped" type="range" min="0" max="100" step="10" value="0" oninput="on_step" onchange="on_step">
</body>
</html>
