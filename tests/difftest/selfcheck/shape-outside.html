<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="shape-outside.css"></head>
<body>
  <div class="host" id="rect-host">
    <div class="fl" id="fl-rect"></div>
    <p id="p-rect"><span class="probe" id="probe-rect"></span></p>
  </div>
  <div class="host" id="circle-host">
    <div class="fl circle" id="fl-circle"></div>
    <p id="p-circle"><span class="probe" id="probe-circle"></span></p>
  </div>
  <div class="host" id="ellipse-host">
    <div class="fl ellipse" id="fl-ellipse"></div>
    <p id="p-ellipse"><span class="probe" id="probe-ellipse"></span></p>
  </div>
  <div class="host" id="inset-host">
    <div class="fl inset" id="fl-inset"></div>
    <p id="p-inset"><span class="probe" id="probe-inset"></span></p>
  </div>
</body>
</html>
