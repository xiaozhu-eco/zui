<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="marker-counters.css">
</head>
<body>
  <ol id="o">
    <li id="a" class="row">one</li>
    <li id="b" class="row">two</li>
  </ol>
  <ol id="s" start="5">
    <li id="s1" class="row">five</li>
    <li id="s2" class="row">six</li>
  </ol>
  <ol id="v">
    <li id="v1" class="row">one</li>
    <li id="v9" class="row" value="9">nine</li>
    <li id="v10" class="row">ten</li>
  </ol>
  <ul id="nest">
    <li id="n1" class="row">outer
      <ol id="inner">
        <li id="i1" class="row">inner-a</li>
        <li id="i2" class="row">inner-b</li>
      </ol>
    </li>
    <li id="n2" class="row">outer-b</li>
  </ul>
  <ol id="author">
    <li id="c1" class="row custom">c1</li>
    <li id="c2" class="row custom">c2</li>
  </ol>
</body>
</html>
