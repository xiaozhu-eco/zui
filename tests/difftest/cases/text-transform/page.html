<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="page.css">
</head>

<body>
    <!-- Advance probes: transparent ink, so the width of the bar is the layout signal. -->
    <div id="up" class="bar">hello wörld 123 αβγ</div>
    <div id="low" class="bar">HELLO ASCII 123</div>
    <div id="cap" class="bar">hello big 3d x-ray</div>
    <div id="none" class="bar">hello ascii 123</div>
    <div id="litup" class="bar">HELLO WÖRLD 123 ΑΒΓ</div>

    <!-- Ink probes: one glyph at the pen origin, so the painted glyph is the signal. -->
    <div id="ink-up" class="ink up">a</div>
    <div id="ink-lit" class="ink">A</div>
    <div id="ink-low" class="ink low">A</div>
    <div id="ink-litlow" class="ink">a</div>
</body>

</html>
