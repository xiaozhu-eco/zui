<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="page.css"></head>
<body>

  <div id="self">
    <div id="c"><span class="ghost">C</span></div>

    <div id="ib"><span class="ghost">J</span></div>
  </div>
