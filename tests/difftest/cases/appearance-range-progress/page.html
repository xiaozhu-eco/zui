<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <!-- appearance:none must match a plain author box (same pattern as radio/checkbox).
       Native track/thumb and progress fill are covered by FormAppearanceRangeProgress. -->
  <div class="row">
    <input id="range-none" type="range" min="0" max="100" value="40">
    <div id="ref-range"></div>
  </div>
  <div class="row">
    <progress id="prog-none" max="100" value="60"></progress>
    <div id="ref-prog"></div>
  </div>
</body>
</html>
