<!DOCTYPE html>
<html>
<head>
  <title>flex text item</title>
  <style>
    .row { display: flex; flex-direction: row; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid #000;
      box-sizing: border-box;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="row" id="row">
    <label class="btn" id="long">Import photos</label>
    <label class="btn" id="short">I</label>
  </div>
</body>
</html>
