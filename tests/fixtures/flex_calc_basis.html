<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="flex_calc_basis.css">
</head>
<body>
  <section class="shelf" id="shelf">
    <header class="topbar" id="topbar">
      <div class="brand" id="brand">品牌</div>
      <div class="menu" id="menu">+</div>
      <div class="finder" id="finder">搜索</div>
      <div class="sort" id="sort">最近</div>
      <div class="view" id="view">封面</div>
      <div class="theme" id="theme">浅色</div>
    </header>
    <div class="shelf-body" id="body">
      <button class="resume" id="resume" type="button">继续阅读</button>
      <div class="books" id="books">
        <div class="card-wrap" id="wrap">
          <button class="card" id="card" type="button"><span class="cover" id="cover">赤心巡天</span></button>
        </div>
        <div class="card-wrap" id="wrap2">
          <button class="card" id="card2" type="button"><span class="cover" id="cover2">灯塔</span></button>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
