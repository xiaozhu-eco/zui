<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: sans-serif; font-size: 16px; }
.stage { display: flex; }
.log { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.msg { display: flex; }
.bubble {
  max-width: min(72%, 520px);
  padding: 8px 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
.ref {
  display: inline-block;
  padding: 8px 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
</style>
</head>
<body>
<div class="stage">
  <div class="log">
    <div class="msg" id="row"><div class="bubble" id="short">知道。</div></div>
    <div class="msg"><div class="bubble" id="medium">如果迟到就先看渡口手记的前言。</div></div>
    <div class="msg"><div class="bubble" id="long">如果迟到就先看渡口手记的前言。如果迟到就先看渡口手记的前言。如果迟到就先看渡口手记的前言。如果迟到就先看渡口手记的前言。</div></div>
  </div>
</div>
<div class="ref" id="ref_short">知道。</div>
<div class="ref" id="ref_medium">如果迟到就先看渡口手记的前言。</div>
</body>
</html>
